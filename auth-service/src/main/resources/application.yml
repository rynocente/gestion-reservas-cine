server:
  port: 50003
  shutdown: graceful

spring:
  application:
    name: auth-service
  boot:
    version: 4.0.3

  # ── Seguridad ──────────────────────────────────────────────────────────────
  # auth-service NO importa desde Config Server (evita circular dependency:
  # Config Server requiere Eureka → Eureka aún no tiene auth-service registrado).
  # Toda la configuración está aquí o en variables de entorno.

# ── Eureka ─────────────────────────────────────────────────────────────────
# auth-service se registra en Eureka para que otros servicios puedan
# descubrirlo por nombre si es necesario.
#eureka:
#  client:
#    service-url:
#      defaultZone: http://localhost:50001/eureka/
#    registry-fetch-interval-seconds: 5
#  instance:
#    prefer-ip-address: true

# ── JWT RS256 ───────────────────────────────────────────────────────────────
# Configuración del emisor de tokens JWT.
# Las claves RSA se generan en memoria al arrancar (JwkConfig).
# Para producción: persistir keypair en un KeyStore o secrets manager.
auth:
  jwt:
    # Valor del claim "iss" en los tokens emitidos.
    # Los Resource Servers deben configurar issuer-uri igual a este valor
    # para que la validación de issuer sea exitosa.
    issuer: http://localhost:50003

    # Tiempo de vida del accessToken en segundos (1 hora)
    access-token-ttl: 3600

    # Tiempo de vida del refreshToken en segundos (24 horas)
    refresh-token-ttl: 86400

# ── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always


logging.level:
  org.springframework.security: DEBUG
